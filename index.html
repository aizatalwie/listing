<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Property Catalogue</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    :root{--black:#111;--gold:#b08a3e;--bg:#f6f6f4;--muted:#707070}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#171717}
    button,input{font:inherit}
    .hero{background:#111;color:#fff;padding:34px 18px 28px}
    .hero-inner{max-width:1120px;margin:auto}
    .brand{font-size:14px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#d8c08a}
    h1{font-size:34px;line-height:1.08;margin:10px 0 8px}
    .subtitle{margin:0;color:#c9c9c9}
    .search-wrap{max-width:1120px;margin:-20px auto 0;padding:0 18px;position:relative}
    .search{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.14);display:flex;gap:10px}
    .search input{border:0;outline:0;width:100%;font-size:16px}
    .filters{max-width:1120px;margin:16px auto;padding:0 18px;display:flex;gap:8px;overflow:auto}
    .filter{border:1px solid #ddd;background:#fff;padding:9px 15px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:700}
    .filter.active{background:#111;color:#fff;border-color:#111}
    .wrap{max-width:1120px;margin:auto;padding:0 18px 40px}
    .meta{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}
    .count{font-weight:800}
    .muted{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 18px rgba(0,0,0,.06);cursor:pointer;transition:.18s}
    .card:hover{transform:translateY(-2px)}
    .photo{height:220px;background:#e9e9e7;position:relative}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .badge{position:absolute;top:12px;left:12px;background:#111;color:#fff;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}
    .sold{background:#a40000}
    .info{padding:15px}
    .title{font-size:18px;font-weight:800;margin:0 0 5px}
    .location{color:#666;font-size:13px;margin-bottom:10px}
    .price{font-size:20px;font-weight:900}
    .specs{display:flex;gap:12px;color:#555;font-size:13px;margin-top:10px}
    .empty{text-align:center;padding:45px 10px;color:#777;grid-column:1/-1}
    .loading{text-align:center;padding:45px;grid-column:1/-1}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:20;overflow:auto}
    .modal.open{display:block}
    .modal-box{background:#fff;max-width:850px;margin:30px auto;border-radius:20px;overflow:hidden;position:relative}
    .close{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:20px;z-index:2;cursor:pointer}
    .gallery{background:#111}
    .main-img{width:100%;height:430px;object-fit:contain;display:block}
    .thumbs{display:flex;gap:7px;overflow:auto;padding:9px;background:#111}
    .thumb{width:70px;height:55px;object-fit:cover;border-radius:7px;cursor:pointer;opacity:.7}
    .thumb.selected{opacity:1;outline:2px solid #fff}
    .detail{padding:22px}
    .detail h2{font-size:27px;margin:0 35px 7px 0}
    .detail-price{font-size:25px;font-weight:900;margin:12px 0}
    .detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
    .spec{background:#f5f5f5;border-radius:12px;padding:12px;text-align:center}
    .spec b{display:block;font-size:16px}
    .spec span{font-size:11px;color:#777}
    .desc{white-space:pre-line;line-height:1.6;color:#444}
    .wa{display:block;text-align:center;text-decoration:none;background:#111;color:#fff;padding:14px;border-radius:12px;font-weight:800;margin-top:20px}
    footer{text-align:center;color:#888;font-size:12px;padding:25px}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){
      h1{font-size:29px}.grid{grid-template-columns:1fr}.photo{height:235px}
      .modal-box{margin:0;border-radius:0;min-height:100vh}.main-img{height:300px}
      .detail-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">Property Catalogue</div>
    <h1>Find Your Next Home</h1>
    <p class="subtitle">Rumah baru & subsale untuk pilihan anda.</p>
  </div>
</header>

<div class="search-wrap">
  <div class="search">
    <span>🔍</span>
    <input id="search" placeholder="Cari rumah, lokasi atau jenis...">
  </div>
</div>

<div class="filters">
  <button class="filter active" data-filter="All">Semua</button>
  <button class="filter" data-filter="New">Rumah Baru</button>
  <button class="filter" data-filter="Subsale">Subsale</button>
  <button class="filter" data-filter="Available">Available</button>
  <button class="filter" data-filter="Sold">Sold</button>
</div>

<main class="wrap">
  <div class="meta">
    <div class="count" id="count">Loading...</div>
    <div class="muted">Updated automatically</div>
  </div>
  <div id="grid" class="grid">
    <div class="loading">Memuatkan listing...</div>
  </div>
</main>

<footer>Property Catalogue</footer>

<div id="modal" class="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://axaunfzdyqgqxtunlntw.supabase.co";
const SUPABASE_KEY = "sb_publishable_fb-Fg80ze_LeA9onM19BUQ_XZAZOp-k";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let listings = [];
let activeFilter = "All";

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function money(v){
  if(v === null || v === undefined || v === "") return "Harga atas permintaan";
  return "RM " + Number(v).toLocaleString("en-MY");
}

function getImage(x){
  return Array.isArray(x.images) && x.images.length ? x.images[0] : "";
}

async function loadListings(){
  const {data,error} = await sb.from("properties")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    $("grid").innerHTML = `<div class="empty">Tidak dapat memuatkan listing.<br>${esc(error.message)}</div>`;
    $("count").textContent = "Ralat";
    return;
  }

  listings = data || [];
  render();
}

function render(){
  const q = $("search").value.trim().toLowerCase();

  const rows = listings.filter(x=>{
    const filterOk =
      activeFilter === "All" ||
      x.listing_type === activeFilter ||
      x.status === activeFilter;

    const searchOk = !q || [
      x.title,x.location,x.listing_type,x.status,x.description
    ].some(v=>String(v||"").toLowerCase().includes(q));

    return filterOk && searchOk;
  });

  $("count").textContent = `${rows.length} ${rows.length === 1 ? "listing" : "listing"}`;

  if(!rows.length){
    $("grid").innerHTML = '<div class="empty">Tiada property dijumpai.</div>';
    return;
  }

  $("grid").innerHTML = rows.map(x=>{
    const img = getImage(x);
    const badgeClass = x.status === "Sold" ? "badge sold" : "badge";
    return `
      <article class="card" onclick="openModal('${x.id}')">
        <div class="photo">
          ${img ? `<img src="${esc(img)}" alt="${esc(x.title)}" loading="lazy">` : `<div style="height:100%;display:grid;place-items:center;font-size:50px">🏠</div>`}
          <span class="${badgeClass}">${esc(x.status || x.listing_type)}</span>
        </div>
        <div class="info">
          <div class="title">${esc(x.title)}</div>
          <div class="location">📍 ${esc(x.location || "Lokasi tidak dinyatakan")}</div>
          <div class="price">${money(x.price)}</div>
          <div class="specs">
            ${x.bedrooms != null ? `<span>🛏 ${esc(x.bedrooms)} bilik</span>` : ""}
            ${x.bathrooms != null ? `<span>🚿 ${esc(x.bathrooms)} air</span>` : ""}
          </div>
        </div>
      </article>`;
  }).join("");
}

$("search").addEventListener("input", render);

document.querySelectorAll(".filter").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    render();
  });
});

window.openModal = function(id){
  const x = listings.find(v=>v.id===id);
  if(!x) return;

  const images = Array.isArray(x.images) ? x.images : [];
  const main = images[0] || "";

  $("modalContent").innerHTML = `
    <div class="gallery">
      ${main ? `<img id="mainImage" class="main-img" src="${esc(main)}" alt="${esc(x.title)}">` :
      `<div class="main-img" style="display:grid;place-items:center;color:#fff;font-size:70px">🏠</div>`}
      ${images.length > 1 ? `<div class="thumbs">${images.map((u,i)=>`
        <img class="thumb ${i===0?"selected":""}" src="${esc(u)}" onclick="changeImage(this,'${esc(u)}')">
      `).join("")}</div>` : ""}
    </div>
    <div class="detail">
      <div class="badge" style="position:static;display:inline-block">${esc(x.listing_type)}</div>
      <h2>${esc(x.title)}</h2>
      <div class="muted">📍 ${esc(x.location || "-")}</div>
      <div class="detail-price">${money(x.price)}</div>

      <div class="detail-grid">
        ${x.bedrooms != null ? `<div class="spec"><b>🛏 ${esc(x.bedrooms)}</b><span>Bilik</span></div>` : ""}
        ${x.bathrooms != null ? `<div class="spec"><b>🚿 ${esc(x.bathrooms)}</b><span>Bilik Air</span></div>` : ""}
        ${x.built_up ? `<div class="spec"><b>📐 ${esc(x.built_up)}</b><span>Built-up</span></div>` : ""}
        ${x.land_area ? `<div class="spec"><b>📏 ${esc(x.land_area)}</b><span>Land Area</span></div>` : ""}
      </div>

      ${x.description ? `<h3>Property Details</h3><div class="desc">${esc(x.description)}</div>` : ""}

      ${x.whatsapp && x.status !== "Sold" ? `
        <a class="wa" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(String(x.whatsapp).replace(/\\D/g,""))}?text=${encodeURIComponent("Hi, saya berminat dengan property: " + x.title + (x.location ? " - " + x.location : ""))}">
          💬 WhatsApp Agent
        </a>` : ""}
    </div>
  `;

  $("modal").classList.add("open");
  document.body.style.overflow = "hidden";
};

window.changeImage = function(el,url){
  const main = $("mainImage");
  if(main) main.src = url;
  document.querySelectorAll(".thumb").forEach(t=>t.classList.remove("selected"));
  el.classList.add("selected");
};

window.closeModal = function(){
  $("modal").classList.remove("open");
  document.body.style.overflow = "";
};

$("modal").addEventListener("click",e=>{
  if(e.target === $("modal")) closeModal();
});

document.addEventListener("keydown",e=>{
  if(e.key === "Escape") closeModal();
});

loadListings();
</script>
</body>
</html>
